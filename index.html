<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Advanced DP & Text Ring Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="tool-card">
  <div class="tool-header">
    <h1>Advanced DP &amp; Text Ring Generator</h1>
    <p>Custom Individual Ring Sizes &amp; Controls</p>
  </div>

  <div class="tool-body">
    <div class="step-group">
      <label class="step-label">1. Upload Your Profile Photo</label>
      <input accept="image/*" id="uploadImage" onchange="loadImage(event)" type="file">
    </div>

    <!-- Independent ON/OFF Toggles -->
    <div class="toggle-row">
      <label><input checked id="enableBorder" onchange="updatePreview()" type="checkbox"> Master Ring ON/OFF</label>
      <label><input checked id="enableText" onchange="updatePreview()" type="checkbox"> Circular Text ON/OFF</label>
      <label><input checked id="enablePrimary" onchange="updatePreview()" type="checkbox"> Primary Color Key</label>
      <label><input checked id="enableSecondary" onchange="updatePreview()" type="checkbox"> Secondary Color Key</label>
      <label><input checked id="enableThird" onchange="updatePreview()" type="checkbox"> Third Color Key</label>
    </div>

    <div class="step-group">
      <label class="step-label">2. Circular Text / Symbols (Around the Ring)</label>
      <input id="circularText" oninput="updatePreview()" placeholder="★ YOUR NAME HERE ★ OFFICIAL ★" type="text" value="★ VENKY ★ OFFICIAL DP ★">
    </div>

    <div class="preview-container">
      <div class="canvas-wrapper" id="canvasWrapper">
        <span class="placeholder-text" id="placeholderText">Upload photo to preview</span>
        <canvas id="previewCanvas" width="250" height="250"></canvas>
      </div>
      <div class="hint-text" id="hintText" style="display: none;">💡 Drag/Swipe to move & Use Zoom slider below</div>
    </div>

    <div class="controls-grid">
      <div class="control-item">
        <label>Select Frame Style</label>
        <select id="frameStyle" onchange="updatePreview()">
          <option value="solid">Solid Ring</option>
          <option value="double">Double Ring</option>
          <option value="triple">Triple Multi-Color Ring</option>
          <option value="neon">Neon Glowing Ring</option>
          <option value="dashed">Dashed Modern Ring</option>
          <option value="gradient">Gradient Blend Ring</option>
        </select>
      </div>
      <div class="control-item">
        <label>Image Zoom In / Out (<span id="zoomVal">1.0</span>x)</label>
        <input id="imageZoom" max="3.0" min="0.5" step="0.1" oninput="updatePreview()" type="range" value="1.0">
      </div>
    </div>

    <!-- Colors & Sizes Grid -->
    <div class="controls-grid">
      <div class="control-item">
        <label>Primary Color &amp; Size</label>
        <input id="primaryColor" onchange="updatePreview()" type="color" value="#1565c0" style="margin-bottom: 5px;">
        <input id="size1" max="30" min="1" oninput="updatePreview()" type="range" value="6">
        <span style="font-size: 11px; color: #65676b;">Size: <span id="s1Val">6</span>px</span>
      </div>
      <div class="control-item">
        <label>Secondary Color &amp; Size</label>
        <input id="secondaryColor" onchange="updatePreview()" type="color" value="#ff9800" style="margin-bottom: 5px;">
        <input id="size2" max="30" min="1" oninput="updatePreview()" type="range" value="6">
        <span style="font-size: 11px; color: #65676b;">Size: <span id="s2Val">6</span>px</span>
      </div>
    </div>

    <div class="controls-grid">
      <div class="control-item">
        <label>Third Color &amp; Size (Triple/Text)</label>
        <input id="thirdColor" onchange="updatePreview()" type="color" value="#2e7d32" style="margin-bottom: 5px;">
        <input id="size3" max="30" min="1" oninput="updatePreview()" type="range" value="6">
        <span style="font-size: 11px; color: #65676b;">Size: <span id="s3Val">6</span>px</span>
      </div>
      <div class="control-item">
        <label>Text Font Size (<span id="textVal">16</span>px)</label>
        <input id="textSize" max="24" min="10" oninput="updatePreview()" type="range" value="16" style="margin-top: 25px;">
      </div>
    </div>

    <button class="action-btn" onclick="downloadImage()">Download Framed Picture</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
